<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Morpheus — Osservazioni</title>
  <link rel="stylesheet" href="/ui/pico.min.css">
  <style>
    .stato { font-size: .8rem; padding: .15rem .6rem; border-radius: 1rem;
             background: var(--pico-secondary-background); color: #fff; }
    .stato.completed  { background: #2e7d32; }
    .stato.in_progress { background: #b26a00; }
    .filtri { display: flex; gap: 1.2rem; flex-wrap: wrap; margin-bottom: .5rem; }
    .filtri label { display: inline-flex; align-items: center; gap: .3rem; margin: 0; }
    #esito:not(:empty), #esito-lancio:not(:empty) { padding: .5rem .75rem; border-radius: .5rem;
                         background: var(--pico-card-background-color); }
    td button { margin: 0; padding: .25rem .7rem; font-size: .8rem; width: auto; }
    nav.schede button { margin-right: .5rem; }
    .tag { font-size: .75rem; padding: .1rem .5rem; border-radius: 1rem;
           background: var(--pico-secondary-background); color: #fff; }
    .tag.fisso { background: #6a4bb2; }
    .tag.split { background: #b26a00; }
    .avviso { color: var(--pico-del-color); }
  </style>
</head>
<body>
  <main class="container">
    <hgroup>
      <h1>Morpheus</h1>
      <p>Pannello osservatorio</p>
    </hgroup>

    <!-- SCHEDE: navigazione tra le viste -->
    <nav class="schede">
      <button id="tab-osservazioni" onclick="mostra('osservazioni')">Osservazioni</button>
      <button id="tab-piano" class="secondary" onclick="mostra('piano')">Piano</button>
    </nav>

    <!-- ================= VISTA: OSSERVAZIONI ================= -->
    <section id="view-osservazioni">
      <details open>
        <summary>Nuova osservazione</summary>
        <form id="nuova" onsubmit="return invia(event)">
          <fieldset>
            <legend>Target</legend>
            <label>Nome <input name="target_name" placeholder="Vega" required></label>
            <div class="grid">
              <label>RA (ore o hh:mm:ss) <input name="ra" placeholder="18:36:56" required></label>
              <label>DEC (gradi o gg:mm:ss) <input name="dec" placeholder="+38:47:01" required></label>
            </div>
          </fieldset>

          <fieldset>
            <legend>Acquisizione</legend>
            <div class="grid">
              <label>Pose <input name="frames" type="number" min="1" value="60" required></label>
              <label>Esposizione (s) <input name="exposition" type="number" min="1" value="120" required></label>
            </div>
            <label>Filtri</label>
            <div class="filtri">
              <label><input type="checkbox" name="filtro" value="L" checked> L</label>
              <label><input type="checkbox" name="filtro" value="R" checked> R</label>
              <label><input type="checkbox" name="filtro" value="G" checked> G</label>
              <label><input type="checkbox" name="filtro" value="B" checked> B</label>
            </div>
            <label>Binning
              <select name="binning" id="binningSelect" required></select>
              <small>Verrà tradotto nella modalità camera corrispondente.</small>
            </label>
            <div class="filtri">
              <label><input type="checkbox" name="guide" checked> Guida</label>
              <label><input type="checkbox" name="focus" checked> Messa a fuoco</label>
              <label><input type="checkbox" name="sequential"> Filtri sequenziali (no rotazione)</label>
            </div>
          </fieldset>

          <fieldset>
            <legend>Scheduling</legend>
            <label>Orario fisso UTC — opzionale
              <input name="fixed_start" placeholder="2026-07-19 23:00:00" oninput="aggiornaVincoli()">
              <small>Se impostato, vince su tutto tranne il meteo (e disattiva i vincoli soft).</small>
            </label>
            <div id="soft">
              <label>Altezza minima (gradi) — opzionale <input name="min_altitude" type="number"></label>
              <div class="grid">
                <label><input type="checkbox" name="moon_check" onchange="aggiornaVincoli()"> Controllo distanza Luna</label>
                <label>Angolo base zona Luna (gradi) <input name="moon_base_angle" type="number" value="90" disabled></label>
              </div>
            </div>
            <label><input type="checkbox" name="splittable"> Splittabile su piu' notti</label>
          </fieldset>

          <button type="submit">Salva osservazione</button>
          <p id="esito"></p>
        </form>
      </details>

      <h2>In coda</h2>
      <button class="secondary" onclick="carica()">Aggiorna</button>
      <p id="esito-lancio"></p>
      <table>
        <thead>
          <tr><th>#</th><th>Target</th><th>RA / DEC</th><th>Pose</th><th>Stato</th><th>Tipo</th><th>Azione</th></tr>
        </thead>
        <tbody id="righe"></tbody>
      </table>
    </section>

    <!-- ================= VISTA: PIANO ================= -->
    <section id="view-piano" hidden>
      <form id="pianifica" onsubmit="return generaPiano(event)">
        <div class="grid">
          <label>Prima sera <input name="date" type="date" required></label>
          <label>Notti <input name="nights" type="number" min="1" value="7" required></label>
          <label>Altezza minima <input name="min_altitude" type="number" value="30" required></label>
        </div>
        <button type="submit">Genera piano</button>
      </form>
      <div id="piano-risultato"></div>
    </section>
  </main>

  <script>
    const form = document.getElementById("nuova");
    const ora = (iso) => iso ? iso.slice(11, 16) : "—";   // "...HH:MM:SS" -> "HH:MM"

    // cambia vista (scheda) e aggiorna l'evidenza dei bottoni
    function mostra(nome) {
      for (const v of ["osservazioni", "piano"]) {
        document.getElementById("view-" + v).hidden = (v !== nome);
        document.getElementById("tab-" + v).className = (v === nome) ? "" : "secondary";
      }
    }

    // orario fisso <-> vincoli soft si escludono
    function aggiornaVincoli() {
      const conFisso = form.fixed_start.value.trim() !== "";
      form.min_altitude.disabled = conFisso;
      form.moon_check.disabled = conFisso;
      if (conFisso) form.moon_check.checked = false;
      form.moon_base_angle.disabled = conFisso || !form.moon_check.checked;
    }

    // ---- vista osservazioni ----
    async function carica() {
      const osservazioni = await (await fetch("/api/v1/observations")).json();
      const corpo = document.getElementById("righe");
      corpo.innerHTML = "";
      for (const o of osservazioni) {
        const tipo = o.fixed_start ? "fisso" : (o.splittable ? "splittabile" : "libero");
        const riga = document.createElement("tr");
        riga.innerHTML = `
          <td>${o.id}</td>
          <td><strong>${o.target_name}</strong></td>
          <td>${o.ra.toFixed(3)} / ${o.dec.toFixed(3)}</td>
          <td>${o.frames_done}/${o.frames}</td>
          <td><span class="stato ${o.status}">${o.status}</span></td>
          <td>${tipo}</td>
          <td><button data-id="${o.id}" data-name="${o.target_name}" onclick="lancia(this)">Lancia</button></td>`;
        corpo.appendChild(riga);
      }
    }

    // lancio manuale di un target ORA (per il collaudo durante la call)
    async function lancia(btn) {
      const id = btn.dataset.id, nome = btn.dataset.name;
      if (!confirm(`Lanciare "${nome}" ORA sul telescopio?`)) return;
      const esito = document.getElementById("esito-lancio");
      const testo0 = btn.textContent;
      btn.disabled = true; btn.textContent = "…";
      esito.textContent = `Lancio di ${nome} in corso… (puo' richiedere qualche minuto)`;
      try {
        const r = await fetch(`/api/v1/dispatch/${id}`, { method: "POST" });
        const d = await r.json();
        const msg = d.error ? d.error : (d.outcome + (d.detail ? " — " + d.detail : ""));
        esito.textContent = `Esito per ${nome}: ${msg}`;
        carica();
      } catch (e) {
        esito.textContent = `Errore di rete: ${e}`;
      } finally {
        btn.disabled = false; btn.textContent = testo0;
      }
    }

    async function invia(evento) {
      evento.preventDefault();
      const esito = document.getElementById("esito");
      const filtri = [...form.querySelectorAll('input[name="filtro"]:checked')].map(c => c.value);
      if (filtri.length === 0) { esito.textContent = "✗ Seleziona almeno un filtro."; return false; }

      const dati = {
        target_name: form.target_name.value,
        ra: form.ra.value, dec: form.dec.value,
        frames: Number(form.frames.value), exposition: Number(form.exposition.value),
        filters: filtri, binning: form.binning.value,
        guide: form.guide.checked, focus: form.focus.checked,
        sequential: form.sequential.checked, splittable: form.splittable.checked,
      };
      if (form.fixed_start.value) dati.fixed_start = form.fixed_start.value;
      if (!form.min_altitude.disabled && form.min_altitude.value)
        dati.min_altitude = Number(form.min_altitude.value);
      if (!form.moon_check.disabled && form.moon_check.checked) {
        dati.moon_check = true;
        dati.moon_base_angle = Number(form.moon_base_angle.value);
      }

      const risposta = await fetch("/api/v1/observations", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify(dati),
      });
      if (risposta.ok) {
        esito.textContent = "✓ " + (await risposta.json()).message;
        form.reset(); aggiornaVincoli(); carica();
      } else {
        const err = await risposta.json();
        esito.textContent = "✗ Errore: " + (typeof err.detail === "string"
          ? err.detail : (err.detail?.[0]?.msg ?? JSON.stringify(err.detail)));
      }
      return false;
    }

    // ---- vista piano ----
    async function generaPiano(evento) {
      evento.preventDefault();
      const f = evento.target;
      const url = `/api/v1/schedule?date=${f.date.value}&nights=${f.nights.value}` +
                  `&min_altitude=${f.min_altitude.value}`;
      const piano = await (await fetch(url, { method: "POST" })).json();
      renderPiano(piano);
    }

    function renderPiano(piano) {
      const cont = document.getElementById("piano-risultato");
      cont.innerHTML = "";

      if (!piano.by_night || piano.by_night.length === 0) {
        cont.innerHTML = "<p>Nessuna notte pianificata (notte bianca o niente da schedulare).</p>";
        return;
      }

      for (const notte of piano.by_night) {
        const s = notte.schedule;
        const art = document.createElement("article");
        let html = `<header><strong>${notte.date}</strong> · buio ${ora(s.night_start)}–${ora(s.night_end)}</header>`;

        if (s.scheduled.length === 0) {
          html += "<small>nessuna osservazione questa notte</small>";
        } else {
          html += "<table><tbody>";
          for (const e of s.scheduled) {
            const tag = e.fixed ? '<span class="tag fisso">fisso</span>'
                      : (e.partial ? '<span class="tag split">split</span>'
                                   : '<span class="tag">libero</span>');
            html += `<tr>
              <td>${ora(e.start)}–${ora(e.end)}</td>
              <td><strong>${e.name}</strong></td>
              <td>${e.frames} pose</td>
              <td>${tag}</td></tr>`;
          }
          html += "</tbody></table>";
        }
        for (const c of s.conflicts)
          html += `<small class="avviso">⚠ ${c.name}: ${c.reason}</small><br>`;
        art.innerHTML = html;
        cont.appendChild(art);
      }

      // avvisi complessivi
      for (const t of (piano.fixed_unschedulable || []))
        cont.insertAdjacentHTML("beforeend", `<small class="avviso">⚠ ${t.name}: ${t.reason}</small><br>`);
    }

    // popola i menu (binning) dalla fonte unica del backend (/config)
    async function caricaConfig() {
      const cfg = await (await fetch("/api/v1/config")).json();
      const sel = document.getElementById("binningSelect");
      sel.innerHTML = cfg.binning.map(b => `<option value="${b}">${b}</option>`).join("");
    }

    // avvio
    document.querySelector('#pianifica input[name="date"]').value =
      new Date().toISOString().slice(0, 10);   // oggi come default
    caricaConfig();
    aggiornaVincoli();
    carica();
  </script>
</body>
</html>
